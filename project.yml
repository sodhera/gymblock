name: GymBlock
options:
  deploymentTarget:
    iOS: '17.0'
  bundleIdPrefix: com.sodhera
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 6LYZDNCM4M
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    majorVersion: 5.0.0
targets:
  GymBlock:
    type: application
    platform: iOS
    sources:
      - path: GymBlock
        excludes: ["*.entitlements"]
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: GymBlock/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        GymBlockPrivacyURL: https://www.orecci.com/gymblock/privacy-policy.html
        GymBlockTermsURL: https://www.orecci.com/gymblock/terms-of-service.html
        CFBundleURLTypes:
          - CFBundleURLName: com.sodhera.gymblock.auth
            CFBundleURLSchemes: [gymblock, com.sodhera.gymblock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.gymblock
        CODE_SIGN_ENTITLEMENTS: GymBlock/GymBlock.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GymBlock
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GymBlockLive
      - target: GymBlockShield
      - target: GymBlockShieldAction
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
  GymBlockLive:
    type: app-extension
    platform: iOS
    sources:
      - GymBlockLive
      - GymBlock/WorkoutActivity.swift
      - GymBlock/WorkoutStepIntent.swift
    info:
      path: GymBlockLive/Info.plist
      properties:
        CFBundleDisplayName: GymBlock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.gymblock.live
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LIVE_EXTENSION
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        SKIP_INSTALL: YES
  GymBlockShield:
    type: app-extension
    platform: iOS
    sources:
      - path: GymBlockShield
        excludes: ["*.entitlements"]
    info:
      path: GymBlockShield/Info.plist
      properties:
        CFBundleDisplayName: GymBlock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).WorkoutShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.gymblock.shield
        CODE_SIGN_ENTITLEMENTS: GymBlockShield/GymBlockShield.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        SKIP_INSTALL: YES
  GymBlockShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: GymBlockShieldAction
        excludes: ["*.entitlements"]
    info:
      path: GymBlockShieldAction/Info.plist
      properties:
        CFBundleDisplayName: GymBlock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).WorkoutShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.gymblock.shield-action
        CODE_SIGN_ENTITLEMENTS: GymBlockShieldAction/GymBlockShieldAction.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        SKIP_INSTALL: YES
  GymBlockTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GymBlockTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GymBlock
  GymBlockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GymBlockUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GymBlock
schemes:
  GymBlock:
    build:
      targets:
        GymBlock: all
    test:
      # One simulator only: parallel clones hide the visible simulator and cost disk.
      targets: [GymBlockTests, GymBlockUITests]
    run:
      config: Debug
