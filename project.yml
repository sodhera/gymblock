name: GymBlock
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
targets:
  GymBlock:
    type: application
    platform: iOS
    sources: [GymBlock]
    info:
      path: GymBlock/Info.plist
      properties:
        UIAppFonts: [DMSans.ttf]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirish.gymblock.prototype
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GymBlock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GymBlockTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GymBlockTests]
    dependencies:
      - target: GymBlock
  GymBlockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GymBlockUITests]
    dependencies:
      - target: GymBlock
schemes:
  GymBlock:
    build:
      targets:
        GymBlock: all
    test:
      targets: [GymBlockTests, GymBlockUITests]
    run:
      config: Debug
      commandLineArguments:
        --demo: true
